name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android (si absent)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Icônes et écran de démarrage
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Permission micro et service vocal
        run: python3 scripts/patch_android.py

      - name: Synchroniser le site dans Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tartilm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
